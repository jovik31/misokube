apiVersion: v1
kind: Pod
metadata:
  name: tenant-a-worker
  namespace: default
  labels:
    setera.com/tenant: "tenant-a"
spec:
  nodeSelector:
    kubernetes.io/hostname: setera-cluster-worker

  containers:
    - name: toolbox
      image: busybox:1.36
      command: ["sleep", "3600"]
      imagePullPolicy: IfNotPresent

  restartPolicy: Always

---
apiVersion: v1
kind: Pod
metadata:
  name: tenant-b-worker
  namespace: default
  labels:
    setera.com/tenant: "tenant-b"
spec:
  nodeSelector:
    kubernetes.io/hostname: setera-cluster-worker

  containers:
    - name: toolbox
      image: busybox:1.36
      command: ["sleep", "3600"]
      imagePullPolicy: IfNotPresent

  restartPolicy: Always

---
apiVersion: v1
kind: Pod
metadata:
  name: tenant-a-control
  namespace: default
  labels:
    setera.com/tenant: "tenant-a"
spec:
  nodeSelector:
    kubernetes.io/hostname: setera-cluster-control-plane

  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

  containers:
    - name: toolbox
      image: busybox:1.36
      command: ["sleep", "3600"]
      imagePullPolicy: IfNotPresent

  restartPolicy: Always

---
apiVersion: v1
kind: Pod
metadata:
  name: tenant-b-control
  namespace: default
  labels:
    setera.com/tenant: "tenant-b"
spec:
  nodeSelector:
    kubernetes.io/hostname: setera-cluster-control-plane

  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

  containers:
    - name: toolbox
      image: busybox:1.36
      command: ["sleep", "3600"]
      imagePullPolicy: IfNotPresent

  restartPolicy: Always
