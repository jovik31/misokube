apiVersion: v1
kind: Pod
metadata:
  name: ping-test2
  namespace: default
  annotations:
    setera.com/tenant: "one"
spec:
  containers:
    - name: toolbox
      image: busybox:1.36
      command: ["sleep", "3600"]
      imagePullPolicy: IfNotPresent
  nodeSelector:
    setera.com.tenant.one: "Enabled"
  restartPolicy: Always
