apiVersion: v1
kind: Pod
metadata:
  name: default-control
  namespace: default
spec:
  nodeSelector:
    kubernetes.io/hostname: setera-cluster-control-plane

  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

  containers:
    - name: toolbox
      image: busybox:1.36
      command: ["sleep", "3600"]

  restartPolicy: Always
