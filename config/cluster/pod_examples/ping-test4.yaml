apiVersion: v1
kind: Pod
metadata:
  name: ping-test4
  namespace: default
  annotations:
    setera.com/tenant: "tenant-b"
spec:
  containers:
    - name: toolbox
      image: busybox:1.36
      command: ["sleep", "3600"]
      imagePullPolicy: IfNotPresent
  nodeSelector:
    setera.com.tenant.one: "Enabled"
  tolerations:
    - key:  "node-role.kubernetes.io/control-plane"
      effect: "NoSchedule"
      operator: "Exists"
  restartPolicy: Always
