# Local Setera end-to-end deployment.
#
# Generated ClusterRoles are intentionally NOT duplicated here.
# Before applying this file:
#
#   make rbac-all
#   kubectl apply -f config/rbac/daemon
#   kubectl apply -f config/rbac/orchestrator
#
# This manifest installs:
#   - the Setera CNI binary/config on every node;
#   - one Setera daemon per Linux node;
#   - one Setera orchestrator for Tenant -> Node assignment.
#
# The kind cluster used for this E2E deployment must have the default CNI
# disabled so Setera can own Pod networking.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: daemon-service-account
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: daemon-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: daemon-role
subjects:
  - kind: ServiceAccount
    name: daemon-service-account
    namespace: default

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orchestrator-service-account
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: orchestrator-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: orchestrator-role
subjects:
  - kind: ServiceAccount
    name: orchestrator-service-account
    namespace: default

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: setera-cni-config
  namespace: default
data:
  10-tenantcni.conf: |
    {
      "cniVersion": "0.4.0",
      "name": "tenantcni",
      "type": "tenantcni"
    }

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: daemon
  namespace: default
  labels:
    app: daemon
    tier: node
spec:
  selector:
    matchLabels:
      app: daemon
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: daemon
        tier: node
    spec:
      serviceAccountName: daemon-service-account

      # The daemon manipulates the node network namespace directly:
      # veths, routes, sysctls, TC and eBPF attachments.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      terminationGracePeriodSeconds: 10

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: In
                    values:
                      - linux

      # Run on control-plane nodes as well as workers for local E2E clusters.
      tolerations:
        - operator: Exists
          effect: NoSchedule

      initContainers:
        # The CNI image is produced by:
        #
        #   make build-cni
        #
        # The image binary is /cni. Kubernetes selects a CNI executable by the
        # "type" field, so install it on the host as "tenantcni".
        - name: install-cni-plugin
          image: cni-uds-stub:dev
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              cp -f /cni /host/opt/cni/bin/tenantcni
              chmod 0755 /host/opt/cni/bin/tenantcni
          volumeMounts:
            - name: cni-bin
              mountPath: /host/opt/cni/bin

        - name: install-cni-config
          image: cni-uds-stub:dev
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /host/etc/cni/net.d
              cp -f /config/10-tenantcni.conf \
                /host/etc/cni/net.d/10-tenantcni.conf
          volumeMounts:
            - name: cni-net-dir
              mountPath: /host/etc/cni/net.d
            - name: cni-config
              mountPath: /config
              readOnly: true

      containers:
        - name: daemon
          image: setera-daemon:v0.1.0
          imagePullPolicy: IfNotPresent
          command:
            - /daemon

          env:
            # cmd/daemon/config.go uses NODE_NAME as the default --node-name.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

            # kind's default IPv4 Pod subnet. This must match the cluster's
            # cluster-wide Pod CIDR, not the individual Node.spec.podCIDR.
            - name: CLUSTER_POD_CIDR
              value: "10.244.0.0/16"

          # KISS for the first E2E deployment. Once the full datapath works,
          # reduce this to the exact capabilities required by TC/eBPF/netlink.
          securityContext:
            privileged: true

          volumeMounts:
            # Shared pinned BPF maps, including tc_podIDs.
            - name: bpffs
              mountPath: /sys/fs/bpf
              mountPropagation: Bidirectional

            # The host CNI binary connects to the daemon through:
            # /var/run/setera/setera.sock
            - name: setera-run
              mountPath: /var/run/setera

            # Durable node-local IPAM allocation state.
            - name: ipam-state
              mountPath: /var/lib/cni/tenantcni/ipam

      volumes:
        - name: cni-bin
          hostPath:
            path: /opt/cni/bin
            type: Directory

        - name: cni-net-dir
          hostPath:
            path: /etc/cni/net.d
            type: DirectoryOrCreate

        - name: cni-config
          configMap:
            name: setera-cni-config

        - name: setera-run
          hostPath:
            path: /var/run/setera
            type: DirectoryOrCreate

        - name: ipam-state
          hostPath:
            path: /var/lib/cni/tenantcni/ipam
            type: DirectoryOrCreate

        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
            type: Directory

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: default
  labels:
    app: orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      serviceAccountName: orchestrator-service-account
      terminationGracePeriodSeconds: 10

      containers:
        - name: orchestrator
          image: setera-orchestrator:v0.1.0
          imagePullPolicy: IfNotPresent
          command:
            - /orchestrator
