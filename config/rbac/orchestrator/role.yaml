---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: orchestrator-role
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - list
- apiGroups:
  - setera.com
  resources:
  - tenants
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - setera.com
  resources:
  - tenants/status
  verbs:
  - update
