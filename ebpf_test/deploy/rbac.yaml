apiVersion: v1
kind: ServiceAccount
metadata:
  name: setera-ebpf-firewall
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: setera-ebpf-firewall
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: setera-ebpf-firewall
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: setera-ebpf-firewall
subjects:
  - kind: ServiceAccount
    name: setera-ebpf-firewall
    namespace: default
