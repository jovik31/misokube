apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: setera-ebpf-firewall
  namespace: default
  labels:
    app: setera-ebpf-firewall
spec:
  selector:
    matchLabels:
      app: setera-ebpf-firewall
  template:
    metadata:
      labels:
        app: setera-ebpf-firewall
    spec:
      hostNetwork: true
      hostPID: true
      serviceAccountName: setera-ebpf-firewall
      # Avoid running on control-plane nodes — firewall would block the API server
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      tolerations:
        - operator: Exists
      containers:
        - name: firewall
          image: setera-ebpf-firewall:dev
          command: ["/firewall"]
          args:
            - "-mode=tc"
            - "-iface=eth0"
            - "-default=allow"
            - "-conntrack=false"
            - "-configmap=firewall-rules"
            - "-configmap-ns=default"
            - "-configmap-key=rules.json"
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
                - SYS_ADMIN
                - BPF
                - NET_RAW
          volumeMounts:
            - name: bpffs
              mountPath: /sys/fs/bpf
            - name: debugfs
              mountPath: /sys/kernel/debug
      volumes:
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
            type: Directory
