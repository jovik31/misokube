apiVersion: v1
kind: Pod
metadata:
  name: router-a
  labels:
    app: tc-router-test
    role: router-a
spec:
  nodeName: setera-ebpf-worker
  containers:
    - name: nettools
      image: busybox:latest
      command: ["sh", "-c"]
      args:
        - |
          sleep 3600
  terminationGracePeriodSeconds: 0
