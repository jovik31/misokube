- name: Install kubeadm prerequisites
  hosts: all
  become: true
  vars:
    k8s_apt_keyring: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  tasks:
    - name: Fail on unsupported OS
      ansible.builtin.fail:
        msg: "Only Debian/Ubuntu hosts are supported by this playbook."
      when: ansible_facts['os_family'] != 'Debian'

    - name: Disable swap
      ansible.builtin.command: swapoff -a
      changed_when: false

    - name: Comment swap in fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s)'
        replace: '# \1'

    - name: Install base packages
      ansible.builtin.apt:
        update_cache: true
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gpg
          - lsb-release
          - containerd
        state: present

    - name: Ensure keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Kubernetes apt key
      ansible.builtin.get_url:
        url: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_repo_version }}/deb/Release.key"
        dest: /tmp/k8s-release.key
        mode: "0644"

    - name: Install Kubernetes apt keyring
      ansible.builtin.command: "gpg --dearmor -o {{ k8s_apt_keyring }} /tmp/k8s-release.key"
      args:
        creates: "{{ k8s_apt_keyring }}"

    - name: Add Kubernetes apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by={{ k8s_apt_keyring }}] https://pkgs.k8s.io/core:/stable:/v{{ k8s_repo_version }}/deb/ /"
        state: present
        filename: kubernetes

    - name: Install kubeadm/kubelet/kubectl (latest)
      ansible.builtin.apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
      when: k8s_version == 'latest'

    - name: Install kubeadm/kubelet/kubectl (pinned)
      ansible.builtin.apt:
        name:
          - "kubelet={{ k8s_version }}"
          - "kubeadm={{ k8s_version }}"
          - "kubectl={{ k8s_version }}"
        state: present
      when: k8s_version != 'latest'

    - name: Hold Kubernetes packages
      ansible.builtin.command: "apt-mark hold kubelet kubeadm kubectl"
      changed_when: false

    - name: Configure containerd
      ansible.builtin.command: containerd config default
      register: containerd_config
      changed_when: false

    - name: Write containerd config
      ansible.builtin.copy:
        dest: /etc/containerd/config.toml
        content: "{{ containerd_config.stdout }}"
        mode: "0644"

    - name: Enable systemd cgroup
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'

    - name: Restart containerd
      ansible.builtin.service:
        name: containerd
        state: restarted
        enabled: true
