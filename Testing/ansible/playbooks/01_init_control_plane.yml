- name: Initialize control plane
  hosts: control_plane
  become: true
  tasks:
    - name: Run kubeadm init
      ansible.builtin.command: >
        kubeadm init
        {% if k8s_version != 'latest' %}--kubernetes-version {{ k8s_version | regex_replace('-.*', '') }}{% endif %}
        --pod-network-cidr {{ pod_network_cidr }}
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Create kubeconfig for root
      ansible.builtin.file:
        path: /root/.kube
        state: directory
        mode: "0700"

    - name: Copy admin kubeconfig for root
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        remote_src: true
        mode: "0600"

    - name: Create kubeconfig for ansible user
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/.kube"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0700"

    - name: Copy admin kubeconfig to ansible user
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: "/home/{{ ansible_user }}/.kube/config"
        remote_src: true
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"

    - name: Create join command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: join_cmd
      changed_when: false

    - name: Write join command to file
      ansible.builtin.copy:
        dest: /tmp/kubeadm_join.sh
        content: "{{ join_cmd.stdout }}"
        mode: "0700"
