kubeconfig: /home/v0id/.kube/config
k8s_version: "latest"
k8s_repo_version: "1.30"
pod_network_cidr: "10.244.0.0/16"

# Repo build settings (for Ansible)
repo_url: "https://github.com/your-org/setera-orchestrator.git"
repo_path: "/opt/setera-orchestrator"

# Image tags used in the DaemonSet template
images:
  daemon: "setera-daemon:v0.1.0"
  orchestrator: "setera-orchestrator:v0.1.0"
  cni: "jovik31/tenantcni:latest"

# SSH / inventory info
ssh:
  user: "ubuntu"
  private_key: "~/.ssh/id_rsa"

nodes:
  control_plane:
    - name: "cp1"
      host: "10.0.0.10"
  workers:
    - name: "worker1"
      host: "10.0.0.11"
    - name: "worker2"
      host: "10.0.0.12"

# Test settings
namespace: "default"
include_control_plane: false
pods_per_node: 2
pod_image: "wbitt/network-multitool:latest"
iperf_image: "networkstatic/iperf3"
perf_tenant: "t1"

# Performance test settings (run_perf_tests.py)
perf:
  tenant_counts: [1, 20]
  pods_per_tenant: [2, 5]
  latency_samples: 200
  ping_interval_seconds: 0.02
  ping_timeout_seconds: 1
  warmup_seconds: 2
  cleanup_between_runs: true
  use_iperf: true
  iperf_seconds: 10
  iperf_protocol: "udp"
  iperf_udp_bandwidth: "100M"
  tenant_name_prefix: "perf"
  zones_override: 0
  wait_timeout_seconds: 60

# Tenants to create for tests
# zones should typically match number of worker nodes
# names should be simple and lowercase

tenants:
  - name: "t1"
    zones: 3
  - name: "t2"
    zones: 3
  - name: "t3"
    zones: 3

# Traffic checks
external_ip: "8.8.8.8"
