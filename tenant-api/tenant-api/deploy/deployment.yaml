apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-api
  namespace: default
  labels:
    app: tenant-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tenant-api
  template:
    metadata:
      labels:
        app: tenant-api
        misokube.com/tenant: default
    spec:
      terminationGracePeriodSeconds: 10
      serviceAccountName: tenant-api
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: tenant-api
          image: tenant-api:ebpf-refactor-v2
          imagePullPolicy: Never
          env:
            - name: TENANT_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tenant-api-auth
                  key: token
            - name: VCLUSTER_EXTERNAL_HOST
              value: "192.168.1.84"
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
