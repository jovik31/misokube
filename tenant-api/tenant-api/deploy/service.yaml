apiVersion: v1
kind: Service
metadata:
  name: tenant-api
  namespace: default
  labels:
    app: tenant-api
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app: tenant-api
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
      protocol: TCP
      name: http
